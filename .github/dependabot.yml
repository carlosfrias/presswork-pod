version: 2
updates:
  # Root npm workspace — picks up package.json + all workspaces under packages/.
  # Majors kept ungrouped so risky bumps (zod, eslint, pino) get individual review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Python agents. Each has its own requirements.txt + requirements-dev.txt.
  # All updates (incl. majors) grouped — deps are >= range constraints on dev
  # tooling, so per-package PRs add noise without buying reviewability.
  - package-ecosystem: "pip"
    directory: "/packages/scout"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-updates:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/packages/design"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-updates:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/packages/shared_py"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all-updates:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
