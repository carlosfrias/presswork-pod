# Railway service definitions for the presswork Ledger Agent.
# Fulfillment is handled by Etsy's native Printify integration — this agent
# only logs metrics and emits financial digests.

[services.ledger-cron-receipts]
type = "cron"
source = "."
schedule = "*/30 * * * *"
command = "npm run poll-receipts --workspace=packages/ledger"

[services.ledger-cron-daily-digest]
type = "cron"
source = "."
schedule = "0 13 * * *"
command = "npm run daily-digest --workspace=packages/ledger"
