# Railway service definitions for the presswork fulfillment agent.
# Do NOT register these services until end-to-end manual verification (step 30) passes.

[services.fulfillment-server]
type = "web"
source = "."
command = "npm run start --workspace=packages/fulfillment"
healthcheckPath = "/healthz"
port = "$PORT"

[services.fulfillment-cron-receipts]
type = "cron"
source = "."
schedule = "*/5 * * * *"
command = "npm run poll-receipts --workspace=packages/fulfillment"

[services.fulfillment-cron-tracking]
type = "cron"
source = "."
schedule = "*/30 * * * *"
command = "npm run poll-tracking --workspace=packages/fulfillment"
