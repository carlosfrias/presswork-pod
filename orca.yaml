# Orca configuration for presswork-pod
# Autonomous print-on-demand pipeline for Etsy — 4-agent system on fleet.
#
# Worktree lifecycle:
#   Setup:  install deps → agent-spec improve → agent dispatch
#   Archive: close session → commit .frias → push → backup

worktree:
  sharedDirectories:
    - node_modules

  setupHooks:
    # Sync IKA governance files from carlos-desktop vault root.
    # Copies .pi/agents/, .pi/skills/, .pi/APPEND_SYSTEM.md, .pi/settings.json
    # from the vault root into this worktree (without overwriting project-specific files).
    - command: |
        VAULT_ROOT="/Users/friasc/Cloud/carlos-desktop"
        mkdir -p .pi/agents .pi/skills
        rsync -a --ignore-existing "$VAULT_ROOT/.pi/agents/" .pi/agents/ 2>/dev/null || true
        rsync -a --ignore-existing "$VAULT_ROOT/.pi/skills/" .pi/skills/ 2>/dev/null || true
        cp -n "$VAULT_ROOT/.pi/APPEND_SYSTEM.md" .pi/ 2>/dev/null || true
        cp -n "$VAULT_ROOT/.pi/settings.json" .pi/ 2>/dev/null || true
      description: Sync IKA governance .pi/ from vault root (agents, skills, settings, APPEND_SYSTEM)

    # Install Node.js dependencies (Listing + Ledger agents are TypeScript)
    # Uses pnpm with global store — near-instant for worktrees (hardlinks, no duplication)
    - command: |
        if [ -f package.json ]; then
          pnpm install 2>/dev/null || true
        fi
      description: Install Node.js dependencies via pnpm for Presswork agents

    # Install Python dependencies (Scout + Design agents are Python)
    - command: |
        if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install -e . 2>/dev/null || true
          deactivate
        fi
      description: Install Python dependencies for Scout and Design agents

    # No STARTUP.md — agents read AGENTS.md for directives.
    # .pi/ governance synced above. Project context is in AGENTS.md.

  archiveHooks:
    # Sync IKA governance .pi/ changes back to vault root.
    - command: |
        VAULT_ROOT="/Users/friasc/Cloud/carlos-desktop"
        rsync -a --ignore-existing .pi/agents/ "$VAULT_ROOT/.pi/agents/" 2>/dev/null || true
        rsync -a --ignore-existing .pi/skills/ "$VAULT_ROOT/.pi/skills/" 2>/dev/null || true
      description: Sync IKA governance .pi/ changes back to vault root

    # Commit .frias artifacts
    - command: |
        if [ -d .frias ] && ! git check-ignore .frias/ >/dev/null 2>&1; then
          git add .frias/ 2>/dev/null || true
          if ! git diff --cached --quiet .frias/ 2>/dev/null; then
            git commit -m "close-session: .frias artifacts" 2>/dev/null || true
          fi
        fi
      description: Commit .frias session artifacts

    # Push branch
    - command: |
        CURRENT_BRANCH=$(git branch --show-current 2>/dev/null || echo "")
        if [ -n "$CURRENT_BRANCH" ] && [ "$CURRENT_BRANCH" != "main" ]; then
          git push origin "$CURRENT_BRANCH" 2>/dev/null || true
        fi
      description: Push worktree branch to GitHub

    # Backup archive
    - command: |
        if [ -d .frias ]; then
          ARCHIVE_NAME="presswork-pod-archive-$(basename $(pwd))-$(date +%Y%m%d-%H%M%S).tar.gz"
          tar -czf "/tmp/${ARCHIVE_NAME}" .frias/ 2>/dev/null || true
        fi
      description: Create /tmp backup archive of .frias session data