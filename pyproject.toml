[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["packages"]
exclude = ["**/__pycache__", "**/.venv", "**/tests/integration/**"]
typeCheckingMode = "basic"
# supabase-py returns JSON (str|int|float|bool|None|Sequence|dict) for .data results;
# narrowing every access with isinstance() is impractical. Suppress the noise.
reportIndexIssue = "none"
reportOptionalSubscript = "none"
reportCallIssue = "none"
reportArgumentType = "none"
